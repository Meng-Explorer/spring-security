server:
  port: 8081
spring:
  application:
    name: security-asymmetric-encryption
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:sqlserver://${DB_URL:localhost}:${DB_PORT:1434};databaseName=${DB_NAME:TechEducation_DB};encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
app:
  security:
    jwt:
      access-token-expiration: 86400000 # 24 hours for local testing (use 900000 for 15 mins in prod)
      refresh-token-expiration: 604800000 # 7 days
    disposable-email: 10minutemail,20minutemail,yopmail,tempmail,guerrillamail,mailinator,trashmail