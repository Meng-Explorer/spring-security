services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: spring_sec_asymetric
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "sa@12345678"
      MSSQL_PORT: 1434
    ports:
      - "1434:1434"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  mssql_data: